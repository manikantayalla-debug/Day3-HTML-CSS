<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 8d</title>
        <style>
            .fname,.lname{
                border-width: 1px;
                border-style: solid;
                border-color: rgb(200, 200, 200);
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 16px;
                padding-right: 16px;
                font-size: 16px;
                border-radius: 8px;
                margin-bottom: 12px;
            }

            .email{
                display: block;
                border-width: 1px;
                border-style: solid;
                border-color: rgb(200, 200, 200);
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 16px;
                padding-right: 248px;
                font-size: 16px;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .signup-button{
                background-color: rgb(47, 127, 231);
                color:white;
                border-radius: 8px;
                border: none;
                font-size: 18px;
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 198px;
                padding-right: 198px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <input class="fname" type="text" placeholder="First name">
        <input class="lname" type="text" placeholder="Last name">
        <input class="email" type="text" placeholder="Email">
        <button class="signup-button">Sign Up</button>

    </body>
</html>
