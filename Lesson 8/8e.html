<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 8e</title>
        <style>
            .title{
                font-size: 40px;
                font-family: Arial;
                margin-bottom: 25px;
            }
            .pickup{
                display: block;
                width: 380px;
                border: none;
                margin-bottom: 8px;
                background-color: rgb(240, 240, 240);
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 16px;
                font-size: 14px;
            }
            .dest{
                display: block;
                width: 380px;
                border: none;
                background-color: rgb(240, 240, 240);
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 16px;
                font-size: 14px;
                margin-bottom: 30px;
            }

            .request{
                background-color: black;
                color: white;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-right: 25px;
                padding-left: 25px;
                border: none;
                margin-right: 20px;
                font-size: 14px;
            }
            .schedule{
                color: black;
                background-color: rgb(240, 240, 240);
                padding-top: 15px;
                padding-bottom: 15px;
                padding-right: 25px;
                padding-left: 25px;
                border: none;
                font-size: 14px;

            }
            
        </style>
    </head>
    <body>
        <p class="title">Request a ride now</p>
        <input class="pickup" type="input" placeholder="Enter pickup location">
        <input class="dest" type="input" placeholder="Enter destination">
        <button class="request">Request now</button>
        <button class="schedule">Schedule for later</button>
    </body>
</html>
